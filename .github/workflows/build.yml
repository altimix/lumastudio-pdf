name: Check and package desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release:check
      - run: npm run build
      - name: Install test browser
        run: npx playwright install chromium
      - name: Verify editor workflows
        run: npm run test:e2e
      - name: Keep failed browser test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Browser-test-results-${{ runner.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Package unsigned Windows preview
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Package Mac preview with ad-hoc integrity signature
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never -c.mac.identity=-
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # PR builds need this even for identity '-'. No signing secrets are supplied.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Verify extracted Mac ZIP integrity and included installation guide
        if: runner.os == 'macOS'
        run: node scripts/release-mac-check.mjs
      - name: Verify packaged app starts and renders a PDF
        run: node scripts/release-smoke.mjs
      - name: Verify Windows installers and GPL license
        if: runner.os == 'Windows'
        run: node scripts/release-check.mjs assets windows release
      - name: Verify Mac archives and GPL license
        if: runner.os == 'macOS'
        run: node scripts/release-check.mjs assets macos release
      - uses: actions/upload-artifact@v4
        with:
          name: LumaStudio-PDF-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/README-Mac.txt
            release/LICENSE.txt
            release/SHA256SUMS-*.txt
